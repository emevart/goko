# LiveKit на VPS Гоко. Ключи приходят из переменной окружения LIVEKIT_KEYS (compose), не отсюда.
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
room:
  auto_create: false       # комнату создаёт только токен с roomConfig из game-server
  empty_timeout: 300
  max_participants: 4
turn:
  enabled: true
  domain: __TURN_DOMAIN__  # deploy.sh подставляет $LK_HOST; TURN только UDP в v1
  udp_port: 3478
logging:
  level: info
  json: false
