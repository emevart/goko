logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
reportAnalysisWinratesAs = BLACK
maxVisits = 400
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2
nnMaxBatchSize = 8
# 2^16 = 65536 позиций кеша: на 13x13 партия редко перебирает больше, а RSS кеша
# держится в десятках МБ. 18 (262144) на VPS с 4 ГБ, где рядом LiveKit, Caddy и
# game-server, а в памяти сразу две сети, рискует OOM-kill прямо во время партии.
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true
# Eigen (CPU) на VPS: 2 потока; на GPU не используется
numEigenThreadsPerModel = 2
